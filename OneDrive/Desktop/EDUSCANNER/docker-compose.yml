  #     POSTGRES_DB: eduscanner
  #     POSTGRES_USER: eduscanner
  #     POSTGRES_PASSWORD: eduscanner
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   restart: unless-stopped

